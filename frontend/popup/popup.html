<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReadSeed</title>
    <style>
      body { width: 240px; margin: 0; padding: 18px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; color: #173b2a; }
      h1 { margin: 0 0 14px; font-size: 20px; }
      button { width: 100%; border: 0; border-radius: 8px; padding: 10px 12px; background: #2c6e49; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover { background: #215838; }
      button:disabled { opacity: 0.65; cursor: wait; }
      #status { min-height: 18px; margin: 10px 0 0; color: #52635a; font-size: 12px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <h1>ReadSeed</h1>
    <button id="analyze" type="button">분석하기</button>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
